name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  react-18:
    name: Build and test with React 18
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies with React 18
        run: |
          for workspace in @linagora/twake-css @linagora/twake-icons @linagora/twake-mui; do
            npm pkg set devDependencies.react=^18.3.1 devDependencies.react-dom=^18.3.1 devDependencies.@types/react=^18.3.0 --workspace=$workspace
          done
          npm pkg set devDependencies.@types/react-dom=^18.3.0 --workspace=@linagora/twake-mui
          # Drop the locked React 19 so that npm resolves React 18 everywhere
          node -e "
            const fs = require('fs')
            const lock = JSON.parse(fs.readFileSync('package-lock.json'))
            for (const key of Object.keys(lock.packages)) {
              if (/node_modules\/(react|react-dom|@types\/react|@types\/react-dom|scheduler)$/.test(key)) delete lock.packages[key]
            }
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2))
          "
          npm install
          npm ls react react-dom @types/react
      - name: Build twake-icons (for type resolution)
        run: npm run build --workspace=@linagora/twake-css --workspace=@linagora/twake-icons
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test --workspace=@linagora/twake-mui
      - name: Test the bundle of a consumer
        run: npm run test:bundle --workspace=@linagora/twake-mui

  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # Same install as the release job
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build twake-icons (for type resolution)
        run: npm run build --workspace=@linagora/twake-css --workspace=@linagora/twake-icons
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run lint:fmt
      - name: Check barrel export
        run: npm run check:barrel --workspace=@linagora/twake-icons
      - name: Build
        run: npm run build
      - name: Test
        run: npm test --workspace=@linagora/twake-mui
      - name: Test the bundle of a consumer
        run: npm run test:bundle --workspace=@linagora/twake-mui
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright dependencies
        run: npx playwright install --with-deps chromium
      - name: Test in a browser
        run: npm run test:browser --workspace=@linagora/twake-mui

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: npm
    permissions:
      contents: write # semantic-release pushes the release commit, the tags and the GitHub releases
      issues: write # @semantic-release/github comments on released issues
      pull-requests: write # @semantic-release/github comments on released PRs
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full git history required for semantic-release (changelog, tags, commits analysis)
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # No lifecycle scripts while the OIDC token can be requested
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
