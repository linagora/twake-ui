name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build twake-icons (for type resolution)
        run: npm run build --workspace=@linagora/twake-icons

      - name: Build twake-mui Storybook
        run: |
          cd packages/twake-mui
          npm run build:doc

      - name: Build twake-icons Storybook
        run: |
          cd packages/twake-icons
          npm run build:doc

      - name: Assemble combined site
        run: |
          mkdir combined
          cp docs/index.html combined/
          touch combined/.nojekyll
          mkdir combined/twake-mui
          cp -r packages/twake-mui/storybook-static/. combined/twake-mui/
          mkdir combined/twake-icons
          cp -r packages/twake-icons/storybook-static/. combined/twake-icons/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5